name: Release

# Run by hand from the Actions tab (or `gh workflow run release.yml`).
# Everything committed to main since the last tag becomes the release: the
# commit prefixes pick the version (see .github/scripts/release-version.sh),
# all three platforms build, and only then is the tag pushed and the release
# published, so a broken build never leaves a dangling tag behind.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (e.g. 1.2.0); empty derives it from the commits since the last tag"
        required: false
        default: ""

permissions:
  contents: write

# two releases racing for the same tag end badly for one of them
concurrency: release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Only main is released
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::releases come from main, this run is on ${{ github.ref }}"
          exit 1

      - id: next
        env:
          EXPLICIT: ${{ inputs.version }}
        run: |
          tag=$(.github/scripts/release-version.sh notes.md "$EXPLICIT")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "## $tag" >> "$GITHUB_STEP_SUMMARY"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: notes
          path: notes.md

  build:
    needs: version
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            build_flags: -platform darwin/universal
            asset: primrose-macos-universal.zip
          - name: windows
            os: windows-latest
            build_flags: -platform windows/amd64 -nsis
            asset: primrose-windows-amd64.zip
          - name: linux
            os: ubuntu-latest
            build_flags: -platform linux/amd64 -tags webkit2_41
            asset: primrose-linux-amd64.zip
    runs-on: ${{ matrix.os }}
    # a build takes a few minutes; a hung runner shouldn't take six hours to notice
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # the Ubuntu mirrors stall now and then: retry instead of hanging
        timeout-minutes: 5
        run: |
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          $apt update
          $apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # the CLI follows go.mod, so a wails bump can't leave it behind again
      - name: Install Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: Build
        run: wails build ${{ matrix.build_flags }} -clean

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/bin/primrose.app ${{ matrix.asset }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/primrose.exe -DestinationPath ${{ matrix.asset }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: zip -j ${{ matrix.asset }} build/bin/primrose

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.asset }}
            build/bin/*-installer.exe
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      # tags the commit that was built, even if main moved on meanwhile
      - name: Tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: dist/notes.md
          files: |
            dist/*.zip
            dist/**/*-installer.exe
          fail_on_unmatched_files: true
