name: Release

# Run by hand from the Actions tab (or `gh workflow run release.yml`).
# Everything committed to main since the last tag becomes the release: the
# commit prefixes pick the version (see .github/scripts/release-version.sh),
# all three platforms build, and only then are tag and release created, in
# one step, so a failed run never leaves a dangling tag behind and publish can
# simply be re-run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (e.g. 1.2.0); empty derives it from the commits since the last tag"
        required: false
        default: ""

# read-only by default: the build legs run npm install with third-party
# code, only publish needs to write
permissions:
  contents: read

# two releases racing for the same tag end badly for one of them
concurrency: release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Only main is released
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::releases come from main, this run is on $REF"
          exit 1

      - id: next
        env:
          EXPLICIT: ${{ inputs.version }}
        run: |
          tag=$(.github/scripts/release-version.sh notes.md "$EXPLICIT")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "## $tag" >> "$GITHUB_STEP_SUMMARY"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: notes
          path: notes.md

  build:
    needs: version
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            build_flags: -platform darwin/universal
            asset: primrose-macos-universal.zip
          # no -nsis: the runner has no makensis, wails only warns about it
          - name: windows
            os: windows-latest
            build_flags: -platform windows/amd64
            asset: primrose-windows-amd64.zip
          - name: linux
            os: ubuntu-latest
            build_flags: -platform linux/amd64 -tags webkit2_41
            asset: primrose-linux-amd64.zip
    runs-on: ${{ matrix.os }}
    # a build takes a few minutes; a hung runner shouldn't take six hours to notice
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # the Ubuntu mirrors stall now and then: retry instead of hanging
        timeout-minutes: 5
        run: |
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          $apt update
          $apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # the CLI follows go.mod, so a wails bump can't leave it behind again
      - name: Install Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: Build
        run: wails build ${{ matrix.build_flags }} -clean

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/bin/primrose.app ${{ matrix.asset }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/primrose.exe -DestinationPath ${{ matrix.asset }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: zip -j ${{ matrix.asset }} build/bin/primrose

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      # creates the tag on the commit that was built (even if main moved on
      # meanwhile) together with the release; pinned, it runs with a write token
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.tag }}
          body_path: dist/notes.md
          files: dist/*.zip
          fail_on_unmatched_files: true
