name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  tag:
    name: Create tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

  build:
    needs: tag
    if: always() && (needs.tag.result == 'success' || github.event_name == 'push')
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            build_flags: -platform darwin/universal
            artifact: build/bin/primrose.app
            asset: primrose-macos-universal.zip
          - name: windows
            os: windows-latest
            build_flags: -platform windows/amd64 -nsis
            artifact: build/bin/primrose.exe
            asset: primrose-windows-amd64.zip
          - name: linux
            os: ubuntu-latest
            build_flags: -platform linux/amd64 -tags webkit2_41
            artifact: build/bin/primrose
            asset: primrose-linux-amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build
        run: wails build ${{ matrix.build_flags }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/bin/primrose.app ${{ matrix.asset }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build/bin/primrose.exe -DestinationPath ${{ matrix.asset }}
        shell: pwsh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: zip -j ${{ matrix.asset }} build/bin/primrose

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.asset }}
            build/bin/*-installer.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: dist/**
          generate_release_notes: true
          draft: false
