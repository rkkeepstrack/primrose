name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend format check
        working-directory: frontend
        run: npm run format:check

      - name: Frontend type check
        working-directory: frontend
        run: npm run check

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Release script tests
        run: bash .github/scripts/release-version.test.sh

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

      # the screenshots run on fixture.json; a backend change that alters what
      # it produces must come with a regenerated fixture (make fixture)
      - name: Screenshot fixture is current
        run: |
          make fixture
          git diff --exit-code frontend/e2e/fixture.json

  screenshots:
    runs-on: ubuntu-latest
    container:
      # same image as `make snapshots`, so the pixels match local runs
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - run: npm ci --no-audit --no-fund

      - run: npm run build

      - run: npx playwright test
        env:
          CI: 1

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
