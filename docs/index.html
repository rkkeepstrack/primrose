<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Primrose — an API Client without Request-Tabs</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      text-align: center;
      color: #333;
    }
    .logo { width: 120px; }
    h1 { margin: 1rem 0 0.5rem; }
    p.tagline { font-size: 1.2rem; color: #555; }
    a.download {
      display: inline-block;
      margin: 1.5rem 0 2.5rem;
      padding: 0.75rem 1.5rem;
      background: #e05a8a;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    a.download:hover { background: #c74a77; }
    img.screenshot {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }
    footer { margin-top: 2rem; font-size: 0.9rem; }
    footer a { color: #e05a8a; }
  </style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Primrose logo">
  <h1>Primrose</h1>
  <p class="tagline">Primrose is an API Client without Request-Tabs.</p>
  <a class="download" href="https://github.com/rkkeepstrack/primrose/releases/latest">Download the latest release</a>
  <div>
    <img class="screenshot" src="screenshot.png" alt="Primrose screenshot">
  </div>
  <div>
    <img class="screenshot" src="screenshot-variables.png" alt="Primrose variables panel screenshot" style="margin-top: 2rem;">
  </div>
  <footer><a href="https://github.com/rkkeepstrack/primrose">View on GitHub</a></footer>
</body>
</html>
